<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Speciali&amp;co</title>
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c-bg:#F7F6F3;--c-surface:#fff;--c-surface2:#F2F1EE;
  --c-border:#E3E2DF;--c-border2:#CFCECA;
  --c-ink:#1C1B19;--c-ink2:#6B6A67;--c-ink3:#A8A7A4;
  --c-blue:#1A56A0;--c-blue-bg:#EAF1FB;
  --c-orange:#924B0C;--c-orange-bg:#FDF0E3;
  --c-green:#2B6E3E;--c-green-bg:#E8F5EE;
  --c-red:#9B2020;--c-red-bg:#FDEAEA;
  --c-amber:#8A5A00;--c-amber-bg:#FEF5E4;
  --radius:2px;--radius-lg:3px;--sidebar-w:220px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  /* fluid scale */
  --fs-xs:clamp(11px,1vw,13px);
  --fs-sm:clamp(13px,1.1vw,15px);
  --fs-base:clamp(13.5px,1.2vw,15px);
  --fs-md:clamp(13px,1.3vw,15px);
  --fs-lg:clamp(16px,2vw,22px);
  --fs-xl:clamp(20px,2.5vw,28px);
  --fs-2xl:clamp(24px,3vw,36px);
  --gap-sm:clamp(8px,1vw,14px);
  --gap-md:clamp(12px,1.5vw,20px);
  --pad-page:clamp(1rem,3vw,2.5rem);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--c-bg);color:var(--c-ink);font-size:var(--fs-base);line-height:1.5;letter-spacing:0.01em;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

/* ── Shell layout ── */
.layout{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;overflow-y:auto}
.content{flex:1;overflow-y:auto}

/* ── Page ── */
.page{padding:var(--pad-page);max-width:1280px}

/* ── Sidebar items ── */
.sb-head{padding:clamp(.875rem,2vw,1.375rem) clamp(.875rem,1.5vw,1.25rem);border-bottom:1px solid var(--c-border);flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sb-logo-icon{width:28px;height:28px;background:var(--c-ink);border-radius:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-icon svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.sb-logo-name{font-size:15px;font-weight:700;letter-spacing:-.3px}
.sb-logo-tag{font-size:11px;color:var(--c-ink3);margin-left:38px}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px clamp(.875rem,1.5vw,1.25rem);font-size:var(--fs-sm);color:var(--c-ink2);border-left:3px solid transparent;transition:background .1s,color .1s;user-select:none}
.sb-item:hover{background:var(--c-bg);color:var(--c-ink);cursor:pointer}
.sb-item.active{background:var(--c-surface2);color:var(--c-ink);border-left-color:var(--c-ink);font-weight:500}
.sb-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.75;flex-shrink:0}
.sb-divider{padding:14px clamp(.875rem,1.5vw,1.25rem) 5px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--c-ink3);border-top:1px solid var(--c-border)}
.sb-footer{padding:.75rem clamp(.875rem,1.5vw,1.25rem) 1rem;border-top:1px solid var(--c-border);font-size:11px;color:var(--c-ink3);line-height:1.6;flex-shrink:0;margin-top:auto}

/* ── Page header ── */
.ph{margin-bottom:var(--gap-md)}
.ph-eyebrow{font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--c-ink3);margin-bottom:4px}
.ph-title{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.3px;color:var(--c-ink)}
.ph-sub{font-size:var(--fs-sm);color:var(--c-ink2);margin-top:3px}

/* ── Stats — fluid auto-fit grid ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:var(--gap-sm);margin-bottom:var(--gap-md)}
.stat{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:clamp(.75rem,1.5vw,1.125rem) clamp(.875rem,1.5vw,1.25rem)}
.stat-val{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-.5px;color:var(--c-ink);line-height:1.2}
.stat-lbl{font-size:var(--fs-xs);color:var(--c-ink3);margin-top:4px;font-weight:500}

/* ── Cards ── */
.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);width:100%}
.card+.card{margin-top:var(--gap-sm)}
.card-header{padding:clamp(.75rem,1.5vw,1rem) clamp(.875rem,1.5vw,1.375rem);border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.card-title{font-size:var(--fs-sm);font-weight:600;color:var(--c-ink)}
.card-meta{font-size:var(--fs-xs);color:var(--c-ink3)}
.card-body{padding:clamp(.875rem,1.5vw,1.375rem)}

/* ── Tables ── */
.card{overflow-x:auto} /* enable horizontal scroll on card level */
table{width:100%;border-collapse:collapse;min-width:480px}
thead tr{background:var(--c-surface2)}
th{padding:clamp(7px,1vw,9px) clamp(8px,1vw,14px);text-align:left;font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c-ink3);border-bottom:1px solid var(--c-border);white-space:nowrap}
td{padding:clamp(7px,1vw,10px) clamp(8px,1vw,14px);border-bottom:1px solid var(--c-border);vertical-align:middle;line-height:1.45;font-size:var(--fs-sm);word-break:break-word;overflow-wrap:anywhere}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--c-bg)}
.td-mono{font-family:'SF Mono','Fira Code',Menlo,monospace;font-size:var(--fs-xs);color:var(--c-ink2)}
.td-bold{font-weight:600}
.td-muted{font-size:var(--fs-xs);color:var(--c-ink3)}

/* ── Badges / chips ── */
.badge{display:inline-flex;align-items:center;padding:2px clamp(5px,0.8vw,8px);border-radius:0;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;letter-spacing:.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.b-blue{background:var(--c-blue-bg);color:var(--c-blue)}
.b-orange{background:var(--c-orange-bg);color:var(--c-orange)}
.b-green{background:var(--c-green-bg);color:var(--c-green)}
.b-red{background:var(--c-red-bg);color:var(--c-red)}
.b-amber{background:var(--c-amber-bg);color:var(--c-amber)}
.b-gray{background:var(--c-surface2);color:var(--c-ink2);border:1px solid var(--c-border)}

/* ── Toolbar / filters ── */
.toolbar{display:flex;align-items:center;gap:var(--gap-sm);margin-bottom:var(--gap-sm);flex-wrap:wrap}
.search{flex:1;min-width:min(200px,100%);display:flex;align-items:center;gap:8px;background:var(--c-surface);border:1px solid var(--c-border2);border-radius:var(--radius);padding:7px 12px}
.search svg{width:14px;height:14px;stroke:var(--c-ink3);fill:none;stroke-width:2;flex-shrink:0}
.search input{border:none;background:transparent;outline:none;font-size:var(--fs-sm);color:var(--c-ink);width:100%;font-family:inherit}
.search input::placeholder{color:var(--c-ink3)}
.filter-group{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{padding:5px clamp(8px,1.2vw,14px);border:1px solid var(--c-border2);border-radius:2px;font-size:var(--fs-xs);font-weight:500;background:var(--c-surface);color:var(--c-ink2);transition:all .12s;white-space:nowrap}
.fbtn:hover{border-color:var(--c-ink);color:var(--c-ink)}
.fbtn.on{background:var(--c-ink);color:var(--c-surface);border-color:var(--c-ink)}

/* ── Form inputs ── */
.form-field{margin-bottom:12px}
.form-label{font-size:var(--fs-xs);font-weight:500;color:var(--c-ink2);margin-bottom:5px;display:block}
.form-input,.form-select{width:100%;padding:8px 12px;border:1px solid var(--c-border2);border-radius:var(--radius);font-size:var(--fs-sm);color:var(--c-ink);background:var(--c-surface);font-family:inherit;outline:none;transition:border .15s}
.form-input:focus,.form-select:focus{border-color:var(--c-ink)}
.form-input-sm{width:min(90px,100%)}

/* ── Calcolatore — fluid 2-col that collapses ── */
.calc-layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:var(--gap-sm);margin-bottom:var(--gap-sm)}
.calc-surface{background:var(--c-surface2);border-radius:var(--radius);padding:10px 14px;font-size:var(--fs-sm);color:var(--c-ink2);display:flex;flex-wrap:wrap;gap:clamp(8px,2vw,20px);margin-top:8px}
.calc-surface strong{color:var(--c-ink);font-weight:600}
.lav-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--c-border)}
.lav-item:last-child{border-bottom:none}
.lav-qty{width:50px;padding:5px 7px;border:1px solid var(--c-border2);border-radius:6px;font-size:var(--fs-sm);color:var(--c-ink);text-align:center;background:var(--c-surface);font-family:inherit;outline:none;flex-shrink:0}
.lav-qty:focus{border-color:var(--c-ink)}
.lav-name{flex:1;font-size:var(--fs-sm);min-width:0}
.lav-price{font-size:var(--fs-xs);color:var(--c-ink3);white-space:nowrap}
.lav-scroll{max-height:min(380px,50vh);overflow-y:auto;padding-right:2px}
.total-strip{background:var(--c-ink);border-radius:var(--radius-lg);padding:clamp(1rem,2.5vw,1.5rem) clamp(1rem,3vw,2rem);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--gap-sm)}
.total-left .total-amount{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-1px;color:#fff}
.total-left .total-label{font-size:var(--fs-xs);color:#888;margin-bottom:4px}
.total-right{text-align:right}
.total-line{font-size:var(--fs-sm);color:#777;line-height:1.8}
.total-line strong{color:#bbb;font-weight:500}

/* ── Balance — fluid 2-col ── */
.balance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:var(--gap-sm)}
.case-card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);overflow:hidden}
.case-head{padding:clamp(.75rem,1.5vw,.875rem) clamp(.875rem,1.5vw,1.25rem);background:var(--c-surface2);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.case-body{padding:1rem 0}
.case-desc{font-size:var(--fs-sm);color:var(--c-ink2);padding:0 clamp(.875rem,1.5vw,1.25rem) .75rem;line-height:1.6;border-bottom:1px solid var(--c-border);margin-bottom:.25rem}
.case-row{display:flex;align-items:center;justify-content:space-between;padding:5px clamp(.875rem,1.5vw,1.25rem);font-size:var(--fs-sm);gap:8px;flex-wrap:wrap}
.case-row:hover{background:var(--c-bg)}
.case-row-cod{font-family:'SF Mono','Fira Code',Menlo,monospace;font-size:var(--fs-xs);color:var(--c-ink2)}
.case-num{font-size:var(--fs-xs);font-weight:700;padding:3px 9px;border-radius:5px;background:var(--c-ink);color:#fff;flex-shrink:0}

/* ── Utility: Convertitore ── */
.util-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:var(--gap-sm);align-items:start}
.rates-list{max-height:min(480px,40vh);overflow-y:auto}
.rate-row{display:grid;grid-template-columns:clamp(50px,6vw,70px) 1fr auto;gap:8px;align-items:center;padding:8px clamp(8px,1.5vw,14px);border-bottom:1px solid var(--c-border);cursor:pointer;transition:background .1s}
.rate-row:last-child{border-bottom:none}
.rate-row:hover{background:var(--c-bg)}
.rate-code{font-weight:700;font-size:var(--fs-xs);letter-spacing:.05em}
.rate-name{font-size:var(--fs-xs);color:var(--c-ink2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.rate-val{font-weight:600;font-size:var(--fs-xs);text-align:right;white-space:nowrap}
.search-conv{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px}

/* ── Schede Tecniche (st-) — all fluid ── */
.st-wrap{padding:var(--pad-page);max-width:1280px}
.st-layout{display:grid;grid-template-columns:clamp(220px,22vw,300px) minmax(0,1fr);gap:var(--gap-sm);align-items:start}
.st-sidebar{position:sticky;top:1rem;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.st-sidebar::before{content:"";display:block;height:3px;background:var(--c-ink)}
.st-sidebar-inner{padding:clamp(.75rem,1.5vw,1rem)}
.st-section+.st-section{margin-top:clamp(.75rem,1.5vw,1rem);padding-top:clamp(.75rem,1.5vw,1rem);border-top:1px solid var(--c-border)}
.st-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.st-pill{display:inline-flex;align-items:center;background:var(--c-ink);color:#fff;border-radius:0;padding:4px 8px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.st-toolbar-inline{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.st-lang-grid{display:flex;flex-wrap:wrap;gap:5px}
.st-lang,.lang{border-radius:0!important;width:clamp(32px,4vw,40px);height:clamp(32px,4vw,40px);border:1px solid var(--c-border);background:var(--c-surface);border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:clamp(14px,2vw,17px);transition:.15s}
.st-lang:hover,.lang:hover{border-color:var(--c-border2)}
.st-lang.active,.lang.active{border-color:var(--c-ink);background:var(--c-ink)}
.st-lang-flag-svg,.lang-flag-svg{display:block;width:clamp(16px,2.2vw,22px);height:clamp(12px,1.6vw,16px)}
#lang-global .st-lang{width:30px;height:26px}
#lang-global .st-lang-flag-svg{width:17px;height:12px}
.st-brand-list,.brand-list{display:grid;gap:6px}
.st-brand-card,.brand-card{border:1px solid var(--c-border);border-radius:var(--radius-lg);background:var(--c-surface);overflow:clip;transition:.16s}
.st-brand-card.active,.brand-card.active{border-color:var(--c-border2);box-shadow:var(--shadow)}
.st-brand-row,.brand-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:stretch}
.st-brand-main,.brand-main{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:transparent;border:0;padding:clamp(8px,1.2vw,11px) clamp(10px,1.5vw,14px);text-align:left;min-height:clamp(48px,6vw,56px);cursor:pointer;font-family:inherit}
.st-brand-main:hover,.brand-main:hover,.st-brand-card.active .st-brand-main,.brand-card.active .brand-main{background:var(--c-surface2)}
.st-brand-left,.brand-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.st-checkbox,.checkbox{width:18px;height:18px;border-radius:4px;border:1px solid var(--c-border2);background:var(--c-surface);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:transparent;flex:0 0 auto}
.st-brand-card.active .st-checkbox,.brand-card.active .checkbox{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.st-brand-meta,.brand-meta{display:grid;gap:2px;min-width:0}
.st-brand-name,.brand-name{font-weight:700;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--c-ink)}
.st-brand-summary,.brand-summary{color:var(--c-ink2);font-size:var(--fs-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-brand-count,.brand-count{display:inline-flex;align-items:center;justify-content:center;min-width:clamp(38px,4.5vw,52px);padding:5px 6px;border:1px solid var(--c-border);border-radius:4px;background:var(--c-surface2);color:var(--c-ink);font-weight:700;font-size:var(--fs-xs);white-space:nowrap;flex:0 0 auto}
.st-submenu-toggle,.submenu-toggle{display:inline-flex;align-items:center;justify-content:center;border:0;border-left:1px solid var(--c-border);background:var(--c-surface2);width:clamp(38px,5vw,48px);min-width:clamp(38px,5vw,48px);padding:0;color:var(--c-ink2);cursor:pointer;position:relative}
.st-submenu-toggle:hover,.submenu-toggle:hover{background:var(--c-bg);color:var(--c-ink)}
.st-submenu-toggle::before,.submenu-toggle::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-1px);transition:transform .18s;margin-top:-3px}
.st-submenu-toggle.open::before,.submenu-toggle.open::before{transform:rotate(225deg) translateY(-1px);margin-top:3px}
.st-submenu,.submenu{max-height:0;opacity:0;overflow:hidden;padding:0 clamp(8px,1.5vw,14px);background:var(--c-surface2);transition:max-height .24s,opacity .2s,padding .22s;border-top:0 solid transparent}
.st-submenu.open,.submenu.open{max-height:420px;opacity:1;border-top:1px solid var(--c-border);padding:10px clamp(8px,1.5vw,14px) 12px}
.st-submenu-head,.submenu-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.st-submenu-title,.submenu-title{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--c-ink2);font-weight:700}
.st-submenu-actions,.submenu-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.st-btn,.mini-btn{min-height:34px;padding:6px clamp(8px,1.2vw,12px);border:1px solid var(--c-border2);border-radius:var(--radius);background:var(--c-surface);color:var(--c-ink);font-size:var(--fs-sm);font-weight:600;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap}
.st-btn:hover,.mini-btn:hover{border-color:var(--c-ink)}
.st-btn.primary{background:var(--c-ink);color:#fff;border-color:var(--c-ink)}
.st-btn.ghost{background:transparent}
.st-btn.warn{background:var(--c-amber-bg);border-color:var(--c-amber);color:var(--c-amber)}
.st-btn:disabled,.mini-btn:disabled{opacity:.45;cursor:not-allowed}
.st-subcat-grid,.subcat-grid{display:flex;flex-wrap:wrap;gap:6px}
.st-subcat,.subcat{border:1px solid var(--c-border);background:var(--c-surface);border-radius:0;padding:5px 8px;font-size:var(--fs-xs);font-weight:700;cursor:pointer;color:var(--c-ink2);transition:.15s;max-width:100%}
.st-subcat:hover,.subcat:hover{border-color:var(--c-border2);color:var(--c-ink)}
.st-subcat.active,.subcat.active{border-color:var(--c-ink);background:var(--c-ink);color:#fff}
.st-field,.field{display:grid;gap:5px;margin-bottom:8px}
.st-field:last-child,.field:last-child{margin-bottom:0}
.st-input,.st-select{width:100%;border:1px solid var(--c-border2);background:var(--c-surface);color:var(--c-ink);border-radius:var(--radius);padding:8px 12px;outline:none;font-size:var(--fs-sm);min-height:40px;font-family:inherit}
.st-input:focus,.st-select:focus{border-color:var(--c-ink)}
.st-topbar,.topbar{display:flex;justify-content:space-between;align-items:center;gap:var(--gap-sm);margin-bottom:var(--gap-sm);flex-wrap:wrap}
.st-tag{display:inline-flex;align-items:center;border:1px solid var(--c-border);background:var(--c-surface2);color:var(--c-ink);border-radius:4px;padding:5px 10px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.st-h2{margin:0 0 5px;font-weight:700;font-size:var(--fs-lg);color:var(--c-ink);letter-spacing:-.025em}
.st-small,.small{color:var(--c-ink2);font-size:var(--fs-sm);line-height:1.5}
.st-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(110px,100%),1fr));gap:var(--gap-sm);margin-bottom:var(--gap-sm)}
.st-stat{border:1px solid var(--c-border);border-radius:var(--radius);padding:clamp(8px,1.5vw,12px);background:var(--c-surface2)}
.st-stat .k{font-size:var(--fs-xs);color:var(--c-ink2);margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.st-stat .v{font-size:clamp(16px,2.5vw,22px);line-height:1;font-weight:700;letter-spacing:-.03em;color:var(--c-ink);overflow:hidden;text-overflow:ellipsis}
.st-table-wrap,.table-wrap{overflow:auto;border:1px solid var(--c-border);border-radius:var(--radius);background:var(--c-surface)}

<script>
(function(){
  var HASH='1817a57c297329040ccfd9b31b1fdfce3d4441ae4437ec3f02003cff0b523314';
  var KEY='_sc_auth';
  // Check existing session
  if(sessionStorage.getItem(KEY)===HASH){
    document.getElementById('auth-gate').style.display='none';
    return;
  }
  // Focus input
  setTimeout(function(){ var i=document.getElementById('auth-pwd'); if(i)i.focus(); },100);
})();

async function authCheck(){
  var pwd=document.getElementById('auth-pwd').value;
  var btn=document.getElementById('auth-btn');
  var err=document.getElementById('auth-err');
  if(!pwd){document.getElementById('auth-pwd').focus();return;}
  btn.disabled=true; btn.textContent='Accesso…'; err.style.display='none';
  try{
    var enc=new TextEncoder().encode(pwd);
    var buf=await crypto.subtle.digest('SHA-256',enc);
    var hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    var HASH='1817a57c297329040ccfd9b31b1fdfce3d4441ae4437ec3f02003cff0b523314';
    if(hash===HASH){
      sessionStorage.setItem('_sc_auth',HASH);
      document.getElementById('auth-gate').style.display='none';
    }else{
      err.style.display='block';
      document.getElementById('auth-pwd').value='';
      document.getElementById('auth-pwd').focus();
    }
  }catch(e){err.textContent='Errore browser. Riprova.';err.style.display='block';}
  btn.disabled=false; btn.textContent='Accedi';
}
</script>

var L3D_PV={ready:false,loading:false,raf:0,rot:{x:0.5,y:0.7},dist:3,err:null};
function l3dPrevLoadThree(cb){
  if(window.THREE){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js';
  s.onload=function(){cb();};
  s.onerror=function(){L3D_PV.err='Three.js non caricato';l3dPrevStatus();};
  document.head.appendChild(s);
}
function l3dPrevLoadBuilder(){
  if(window.buildArchFromDef)return true;
  try{
    /* il blob del Disegno vive dentro initCK(): ne leggo il sorgente per non duplicare la geometria */
    var m=String(initCK).match(/var b64ck="([A-Za-z0-9+\/=]+)"/);
    if(!m)throw new Error('sorgente Disegno non trovato');
    var ck=atob(m[1]);
    function chunk(a,b){
      var i=ck.indexOf(a),j=ck.indexOf(b,i);
      if(i<0||j<0)throw new Error('blocco non trovato: '+a);
      return ck.slice(i,j);
    }
    var code=chunk('var ARCH_MAT={','function buildArchetype(')+
             chunk('function archExpr(','function loadCfg3d(');
    (0,eval)(code);
    return !!window.buildArchFromDef;
  }catch(e){L3D_PV.err='Motore archetipi: '+e.message;return false;}
}
function l3dPrevStatus(msg){
  var el=document.getElementById('l3d-pv-status');
  if(!el)return;
  if(L3D_PV.err){el.style.color='#b91c1c';el.textContent=L3D_PV.err;return;}
  el.style.color='#8b8a86';el.textContent=msg||'';
}

function l3dPrevInit(){
  if(L3D_PV.ready)return;
  var cv=document.getElementById('l3d-pv-canvas');
  if(!cv)return;
  var S=L3D_PV;
  S.scene=new THREE.Scene();
  S.scene.background=new THREE.Color(0xffffff);
  S.camera=new THREE.PerspectiveCamera(45,1,0.01,100);
  S.renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  S.renderer.setPixelRatio(window.devicePixelRatio||1);
  S.scene.add(new THREE.AmbientLight(0xffffff,0.72));
  var k=new THREE.DirectionalLight(0xffffff,0.62);k.position.set(4,7,5);S.scene.add(k);
  var f=new THREE.DirectionalLight(0xffffff,0.26);f.position.set(-5,4,-4);S.scene.add(f);
  S.root=new THREE.Group();S.scene.add(S.root);
  /* orbita e zoom con il mouse */
  var down=false,px=0,py=0;
  cv.addEventListener('pointerdown',function(e){down=true;px=e.clientX;py=e.clientY;try{cv.setPointerCapture(e.pointerId);}catch(_){}});
  cv.addEventListener('pointermove',function(e){
    if(!down)return;
    S.rot.y+=(e.clientX-px)*0.01;
    S.rot.x=Math.max(-1.4,Math.min(1.4,S.rot.x+(e.clientY-py)*0.01));
    px=e.clientX;py=e.clientY;l3dPrevCam();
  });
  cv.addEventListener('pointerup',function(){down=false;});
  cv.addEventListener('pointercancel',function(){down=false;});
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    S.dist=Math.max(0.4,Math.min(20,S.dist*(e.deltaY>0?1.12:0.89)));
    l3dPrevCam();
  },{passive:false});
  S.ready=true;
  (function loop(){
    S.raf=requestAnimationFrame(loop);
    var w=cv.clientWidth,h=cv.clientHeight;
    if(w&&h&&(cv.width!==Math.round(w*(window.devicePixelRatio||1))||S._h!==h)){
      S.renderer.setSize(w,h,false);
      S.camera.aspect=w/h;S.camera.updateProjectionMatrix();S._h=h;
    }
    S.renderer.render(S.scene,S.camera);
  })();
}
function l3dPrevCam(){
  var S=L3D_PV;
  if(!S.camera)return;
  var t=S.target||new THREE.Vector3(0,0.45,0);
  S.camera.position.set(
    t.x+S.dist*Math.cos(S.rot.x)*Math.sin(S.rot.y),
    t.y+S.dist*Math.sin(S.rot.x),
    t.z+S.dist*Math.cos(S.rot.x)*Math.cos(S.rot.y));
  S.camera.lookAt(t);
}
function l3dPrevBuild(){
  var S=L3D_PV;
  if(!S.ready||!window.buildArchFromDef)return;
  while(S.root.children.length)S.root.remove(S.root.children[0]);
  S.err=null;
  var L=(parseFloat(document.getElementById('l3d-pv-l').value)||1200)/1000;
  var P=(parseFloat(document.getElementById('l3d-pv-p').value)||600)/1000;
  var H=(parseFloat(document.getElementById('l3d-pv-h').value)||850)/1000;
  /* pavimento e ingombro di riferimento */
  var grid=new THREE.GridHelper(Math.max(L,P)*3,12,0xd8d7d3,0xe8e7e3);
  S.root.add(grid);
  var box=new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(L,H,P)),
    new THREE.LineBasicMaterial({color:0xc9c8c4}));
  box.position.y=H/2;
  S.root.add(box);
  var n=0;
  try{
    var def=JSON.parse(document.getElementById('l3d-arch-json').value);
    if(!def||!Array.isArray(def.parti))throw new Error('manca l\u0027array "parti"');
    var obj=buildArchFromDef(def.parti,L,H,P);
    S.root.add(obj);
    obj.traverse(function(o){if(o.isMesh)n++;});
  }catch(e){
    S.err='JSON: '+e.message;
  }
  S.target=new THREE.Vector3(0,H/2,0);
  S.dist=Math.max(L,P,H)*2.2+0.5;
  l3dPrevCam();
  l3dPrevStatus(n?(n+' parti generate su '+Math.round(L*1000)+'\u00d7'+Math.round(P*1000)+'\u00d7'+Math.round(H*1000)+' mm'):'Nessuna parte visibile con queste dimensioni');
}

async function l3dArchSave(){
  var nome=document.getElementById('l3d-arch-nome').value.trim().toLowerCase();
  var note=document.getElementById('l3d-arch-note').value.trim();
  if(!nome){alert('Serve un nome.');return;}
  var parti;
  try{
    parti=JSON.parse(document.getElementById('l3d-arch-json').value);
    if(!parti||!Array.isArray(parti.parti)||!parti.parti.length)throw new Error('manca l\u0027array "parti"');
    parti.parti.forEach(function(p,k){
      if(p.forma!=='box'&&p.forma!=='cyl')throw new Error('parte '+(k+1)+': forma deve essere box o cyl');
    });
  }catch(e){alert('JSON non valido: '+e.message);return;}
  try{
    var body=JSON.stringify({nome:nome,parti:parti,note:note||null});
    var h=l3dHdr(true);h['Prefer']='resolution=merge-duplicates,return=minimal';
    const r=await pgcFetch(PGC_URL+'/rest/v1/archetipi_3d?on_conflict=nome',{method:'POST',headers:h,body:body});
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(L3D_ARCH_EDIT&&L3D_ARCH_EDIT!==nome){
      await pgcFetch(PGC_URL+'/rest/v1/archetipi_3d?nome=eq.'+encodeURIComponent(L3D_ARCH_EDIT),{method:'DELETE',headers:l3dHdr(true)});
    }
    l3dArchClose();
    await l3dArchLoad();
  }catch(e){alert('Salvataggio non riuscito: '+e.message);}
}

async function l3dCfgSave(i,val){
  var c=L3D.cfg[i];
  var prefs=String(val).split(',').map(function(x){return parseInt(x.trim(),10);}).filter(function(n){return n>=1&&n<=4;});
  if(!prefs.length){alert('Preferenze non valide: usa numeri 1-4 separati da virgola.');l3dCfgRender();return;}
  if(prefs.indexOf(1)<0)prefs.push(1);
  try{
    const r=await pgcFetch(PGC_URL+'/rest/v1/config_livelli_3d?brand=eq.'+encodeURIComponent(c.brand),
      {method:'PATCH',headers:l3dHdr(true),body:JSON.stringify({preferenze:prefs})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    c.preferenze=prefs;l3dCfgRender();l3dLoadCov();l3dRender();
  }catch(e){alert('Salvataggio non riuscito: '+e.message);}

function l3dEff(r){
  if(r.livello_forzato){
    if(r.livello_forzato===4&&r.glb_url)return 4;
    if(r.livello_forzato===3&&r.archetipo)return 3;
    if(r.livello_forzato===2&&r.sagoma)return 2;
    return 1;
  }
  var cfg={};L3D.cfg.forEach(function(c){cfg[c.brand]=c.preferenze;});
  var prefs=cfg[r.brand]||cfg['*']||[4,3,2,1];
  for(var k=0;k<prefs.length;k++){
    var p=prefs[k];
    if(p===4&&r.glb_url)return 4;
    if(p===3&&r.archetipo)return 3;
    if(p===2&&r.sagoma)return 2;
    if(p===1)return 1;
  }
  return 1;
}

/* fetch robusta verso Supabase: timeout e ritenta sugli errori di rete (mai sugli HTTP) */
async function pgcFetch(url,opts,tries){
  tries=(tries==null)?2:tries;
  for(var a=0;;a++){
    var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
    var tm=ctrl?setTimeout(function(){try{ctrl.abort();}catch(_){}},15000):null;
    try{
      var o=Object.assign({},opts||{});
      if(ctrl)o.signal=ctrl.signal;
      var r=await fetch(url,o);
      if(tm)clearTimeout(tm);
      return r;
    }catch(e){
      if(tm)clearTimeout(tm);
      if(a>=tries)throw e;
      await new Promise(function(res){setTimeout(res,600*(a+1));});
    }
  }
}
function pgcHdr(json){
  const h={apikey:PGC_KEY,Authorization:'Bearer '+PGC_KEY};
  if(json)h['Content-Type']='application/json';
  return h;
}
function pgcFmt(iso){
  if(!iso)return '\u2014';
  try{
    const d=new Date(iso);
    return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  }catch(e){return '\u2014';}
}

  if(field==='nome'&&!val){val='Senza nome';inp.value=val;}
  if(val===(inp.dataset.orig||''))return; /* nessuna modifica */
  inp.classList.remove('pgc-ok','pgc-err');
  try{
    let tnkUser=null; try{tnkUser=localStorage.getItem('tnk_user')||null;}catch(e){}
    const now=new Date().toISOString();
    const patch={aggiornato:now,aggiornato_da:tnkUser};
    patch[field]=val||null;
    const r=await pgcFetch(PGC_URL+'/rest/v1/progetti?id=eq.'+id,{method:'PATCH',headers:pgcHdr(true),body:JSON.stringify(patch)});
    if(!r.ok)throw new Error('HTTP '+r.status);
    inp.dataset.orig=val;
    inp.classList.add('pgc-ok');
    setTimeout(function(){inp.classList.remove('pgc-ok');},1200);
    /* aggiorna la cella "ultima modifica" della stessa riga senza ricaricare */
    const cell=document.getElementById('pgc-mod-'+id);
    if(cell)cell.innerHTML=pgcFmt(now)+'<br><span style="color:var(--p-muted)">'+pgcUser(tnkUser)+'</span>';
  }catch(e){
    console.warn('pgcInlineSave:',e);
    inp.classList.add('pgc-err');
  }
}

/* ─── ricerca indirizzo integrata (geocoder OpenStreetMap/Nominatim, senza chiave) ───
   struttura gia' pronta per passare a Google Places quando ci sara' una API key */
function addrAttach(inp,onPick){
  if(!inp||inp._addrWired)return;
  inp._addrWired=true;
  /* il menu vive su body in position:fixed, ancorato al campo: cosi' non resta
     mai intrappolato dentro modali o celle con overflow */
  var box=document.createElement('div');
  box.className='addr-sugg';
  document.body.appendChild(box);
  function place(){
    var r=inp.getBoundingClientRect();
    box.style.left=r.left+'px';
    box.style.top=(r.bottom+2)+'px';
    box.style.width=r.width+'px';
  }
  window.addEventListener('scroll',function(){box.style.display='none';},true);
  window.addEventListener('resize',function(){box.style.display='none';});
  inp.setAttribute('autocomplete','off');
  var t=null;
  inp.addEventListener('input',function(){
    if(t)clearTimeout(t);
    box.style.display='none';box.innerHTML='';
    var q=inp.value.trim();
    if(q.length<4)return;
    t=setTimeout(function(){
      fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&accept-language=it&q='+encodeURIComponent(q))
        .then(function(r){return r.json();})
        .then(function(res){
          box.innerHTML='';
          if(!res||!res.length){box.style.display='none';return;}
          res.forEach(function(it){
            var a=it.address||{};
            var via=((a.road||a.pedestrian||a.square||'')+' '+(a.house_number||'')).trim();
            var citta=a.city||a.town||a.village||a.municipality||'';
            var prov=a.county||a.province||a.state_district||a.state||'';
            var naz=a.country||'';
            var parts=[];
            if(via)parts.push(via);
            var l2=((a.postcode||'')+' '+citta).trim();
            if(l2)parts.push(l2);
            if(prov&&prov!==citta)parts.push('('+prov+')');
            if(naz)parts.push(naz);
            var label=parts.length?parts.join(', '):(it.display_name||'');
            var d=document.createElement('div');
            d.className='addr-item';
            d.textContent=label;
            d.addEventListener('mousedown',function(ev){
              ev.preventDefault();
              inp.value=label;
              box.style.display='none';
              if(onPick)onPick({formatted:label,nazione:naz});
            });
            box.appendChild(d);
          });
          place();
          box.style.display='block';
        })
        .catch(function(){box.style.display='none';});
    },400);
  });
  inp.addEventListener('blur',function(){setTimeout(function(){box.style.display='none';},200);});
}

/* aggancia la ricerca agli input indirizzo delle righe clienti:

  });
}

var OFF={rows:[],cloudId:null,nome:'Nuova offerta',testata:[],areas:[],condizioni:[]};
/* percorso area normalizzato: max 3 livelli separati da " / " */
function offPathNorm(s){
  return String(s||'').split('/').map(function(x){return x.trim();}).filter(Boolean).slice(0,3).join(' / ');
}
/* gruppi ordinati: '' (senza area) + aree dichiarate + aree presenti nelle righe */
function offGroups(){
  var seen={},out=[];
  function add(p){p=offPathNorm(p);if(seen[p]!==undefined)return;seen[p]=1;out.push(p);}
  add('');
  (OFF.areas||[]).forEach(add);
  OFF.rows.forEach(function(r){add(r.path||'');});
  return out;
}
/* testata di default costruita da progetto + anagrafica cliente (senza toccarla) */
function offBuildTestata(){
  var cli=null;
  if(OFF.cliente)cli=PGC_CLIENTI.find(function(c){return c.nome===OFF.cliente;})||null;
  function f(k,v){return {k:k,v:String(v||''),print:!!String(v||'').trim()};}
  return [
    f('Cliente',OFF.cliente),
    f('P.IVA',cli?cli.piva:''),
    f('Indirizzo',cli?cli.indirizzo:''),
    f('Nazione',cli?cli.nazione:''),
    f('Commerciale',OFF.commerciale||(cli?cli.commerciale:''))
  ];
}
var OFF_CAT=[];
function offEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function offEur(n){return '\u20ac '+(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});}
function offRowTot(r){return (Number(r.qty)||0)*(Number(r.prezzo)||0)*(1-(Number(r.sconto)||0)/100);}

var OFF_CAT_STATE='idle'; /* idle | loading | ready | error */
async function offLoadCatalog(){
  if(OFF_CAT_STATE==='loading')return;
  if(OFF_CAT_STATE==='ready'&&OFF_CAT.length)return;
  OFF_CAT_STATE='loading';offCatStatus();
  try{
    const cols='id,brand,gamma,categoria,nome,modello,codice,prezzo,l,p,h,peso_netto_kg,peso_lordo_kg,larghezza_imballo_mm,profondita_imballo_mm,altezza_imballo_mm,descrizione_estesa,descrizione_listino';
    var all=[],from=0;
    for(;;){
      const h=Object.assign({Range:from+'-'+(from+999)},pgcHdr());
      const r=await pgcFetch(PGC_URL+'/rest/v1/catalogo?select='+cols+'&attivo=eq.true&order=id',{headers:h});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const rows=await r.json();
      all=all.concat(rows||[]);
      if(!rows||rows.length<1000)break;
      from+=1000;
    }
    OFF_CAT=all;
    OFF_CAT_STATE='ready';
  }catch(e){
    console.warn('offLoadCatalog:',e);
    OFF_CAT_STATE='error';
  }
  offCatStatus();
}
/* stato del pannello ricerca quando non c'e' una query attiva */
function offCatStatus(){
  var box=document.getElementById('off-cat-res');
  var q=document.getElementById('off-cat-q');
  if(!box||(q&&q.value.trim().length>=2&&OFF_CAT_STATE==='ready'))return;
  if(OFF_CAT_STATE==='loading')box.innerHTML='<div style="color:#8b8a86;font-size:12px;padding:8px">\u23f3 Caricamento del listino ('+(OFF_CAT.length||0)+' finora)\u2026</div>';
  else if(OFF_CAT_STATE==='error')box.innerHTML='<div style="color:#b91c1c;font-size:12px;padding:8px">\u2717 Listino non raggiungibile. <a href="#" onclick="OFF_CAT_STATE=\'idle\';offLoadCatalog();return false" style="color:#0d7a5f">Riprova</a></div>';
  else if(OFF_CAT_STATE==='ready')box.innerHTML='<div style="color:#8b8a86;font-size:12px;padding:8px">\u2713 Listino pronto: '+OFF_CAT.length+' prodotti. Digita per cercare.</div>';
}
async function initOfferta(){
  var ne=document.getElementById('off-nome');
  if(ne)ne.value=OFF.nome;
  offRender();
  try{if(!PGC_CLIENTI.length)await pgcFetchClienti();}catch(e){console.warn('clienti offerta:',e);}
  await offCondLoadDef();
  if(!(OFF.condizioni||[]).length)OFF.condizioni=offCondCopyDef();
  if(!(OFF.testata||[]).length&&OFF.cliente)OFF.testata=offBuildTestata();
  offTestRender();
  offCondRender();
  offSecApply();
  await offLoadCatalog();
  /* apertura diretta dalla pagina Progetti */
  var openId=null;
  try{openId=localStorage.getItem('tnk_off_open_id');}catch(e){}
  if(openId){
    try{localStorage.removeItem('tnk_off_open_id');}catch(e){}
    await offLoadProject(openId,true);
  }
  offConsumeTransfer(); /* dopo il catalogo: le righe in arrivo si arricchiscono dal listino */
}

/* consuma un trasferimento in arrivo da Disegno o Piano di carico */
function offConsumeTransfer(){
  var raw=null;
  try{raw=localStorage.getItem('tnk_off_import');}catch(e){}
  if(!raw)return;
  try{localStorage.removeItem('tnk_off_import');}catch(e){}
  var payload=null;
  try{payload=JSON.parse(raw);}catch(e){return;}
  if(!payload||!payload.items||!payload.items.length)return;
  if(payload.progetto){OFF.nome=payload.progetto;var ne=document.getElementById('off-nome');if(ne)ne.value=OFF.nome;}
  if(payload.cloudId)OFF.cloudId=payload.cloudId;
  var added=0,matched=0;
  payload.items.forEach(function(it){
    var code=String(it.code||'').trim();
    var area=offPathNorm(it.area||'');
    var posn=String(it.posn||'');
    var cat=code?OFF_CAT.find(function(x){return x.codice&&String(x.codice).trim()===code;}):null;
    var qty=Math.max(1,Math.round(Number(it.qty)||1));
    var ex=code?OFF.rows.find(function(r){return r.codice===code&&offPathNorm(r.path||'')===area;}):null;
    if(ex){ex.qty=(Number(ex.qty)||0)+qty;added++;return;}
    if(cat){
      matched++;
      OFF.rows.push({codice:code,brand:cat.brand||'',nome:cat.nome||'',modello:cat.modello||it.model||'',
        descr:(cat.brand?cat.brand+' \u2014 ':'')+(cat.nome||''),qty:qty,prezzo:Number(cat.prezzo)||0,sconto:0,catId:cat.id,path:area,pos:posn});
    }else{
      OFF.rows.push({codice:code,brand:it.brand||'',nome:it.nome||'',modello:it.model||'',
        descr:it.nome||code||'Articolo',qty:qty,prezzo:0,sconto:0,path:area,pos:posn});
    }
    added++;
  });
  offRender();
  if(added)setTimeout(function(){alert('\u2713 Ricevuti '+added+' articoli ('+matched+' agganciati al listino).');},100);
}

/* ── catalogo: ricerca e inserimento sequenziale ── */
function offToggleCat(){
  var p=document.getElementById('off-cat-panel');
  p.style.display=(p.style.display==='none')?'block':'none';
  if(p.style.display==='block'){
    document.getElementById('off-cat-q').focus();
    if(OFF_CAT_STATE==='idle')offLoadCatalog();else offCatStatus();
  }
}
function offCatSearch(q){
  var box=document.getElementById('off-cat-res');
  q=String(q||'').trim().toLowerCase();
  if(OFF_CAT_STATE!=='ready'){
    if(OFF_CAT_STATE==='idle')offLoadCatalog();
    offCatStatus();
    return;
  }
  if(q.length<2){offCatStatus();return;}
  var hits=OFF_CAT.filter(function(c){
    return [c.nome,c.modello,c.codice,c.brand,c.gamma,c.categoria].some(function(v){
      return v&&String(v).toLowerCase().indexOf(q)>=0;
    });
  }).slice(0,40);
  if(!hits.length){box.innerHTML='<div style="color:#8b8a86;font-size:12px;padding:8px">Nessun risultato.</div>';return;}
  box.innerHTML=hits.map(function(c){
    return '<div class="addr-item" style="display:flex;gap:10px;align-items:baseline" onclick="offAddFromCat('+c.id+')">'+
      '<b style="min-width:120px">'+offEsc(c.brand)+'</b>'+
      '<span style="flex:1">'+offEsc(c.nome)+(c.modello?' \u2014 '+offEsc(c.modello):'')+'</span>'+
      '<span style="color:#8b8a86;font-size:11px">'+offEsc(c.codice||'')+'</span>'+
      '<span style="font-weight:600">'+(c.prezzo!=null?offEur(c.prezzo):'<span style=\'color:#8b8a86;font-weight:400\'>n.d.</span>')+'</span>'+
    '</div>';
  }).join('');
}
function offAddFromCat(id){
  var c=OFF_CAT.find(function(x){return x.id===id;});
  if(!c)return;
  var tgEl=document.getElementById('off-cat-target');
  var tgt=tgEl?offPathNorm(tgEl.value):'';
  var ex=OFF.rows.find(function(r){return r.codice&&c.codice&&r.codice===c.codice&&offPathNorm(r.path||'')===tgt;});
  if(ex){ex.qty=(Number(ex.qty)||0)+1;}
  else{
    OFF.rows.push({codice:c.codice||'',brand:c.brand||'',nome:c.nome||'',modello:c.modello||'',
      descr:(c.brand?c.brand+' \u2014 ':'')+(c.nome||''),qty:1,prezzo:Number(c.prezzo)||0,sconto:0,catId:c.id,path:tgt,pos:''});
  }
  offRender();
}

/* ── righe ── */
function offRender(){
  var tb=document.getElementById('off-tbody');
  if(!tb)return;
  var groups=offGroups();
  var haveAny=OFF.rows.length||groups.length>1;
  if(!haveAny){
    tb.innerHTML='<tr><td colspan="10" style="text-align:center;color:#8b8a86;padding:20px">Offerta vuota: aggiungi prodotti dal catalogo (in fondo) o importa un Excel.</td></tr>';
  }else{
    var html='',n=0;
    groups.forEach(function(gp){
      var rows=[];
      OFF.rows.forEach(function(r,i){if(offPathNorm(r.path||'')===gp)rows.push([r,i]);});
      if(gp){
        var parts=gp.split(' / ');
        var depth=parts.length;
        var lab=parts[parts.length-1];
        html+='<tr class="off-area-row"><td colspan="10" style="padding:'+(depth===1?'9px':'6px')+' 14px;background:'+(depth===1?'#ecebe8':'#f7f6f3')+'">'+
          '<span style="display:inline-block;padding-left:'+((depth-1)*18)+'px;font-weight:700;font-size:'+(depth===1?'12.5':'11.5')+'px;'+(depth===1?'color:#b91c1c;text-transform:uppercase;letter-spacing:.04em':'color:#1c1b19')+'">'+offEsc(lab)+'</span>'+
          '<span style="float:right;white-space:nowrap">'+
          '<button class="pgc-abtn" style="width:24px;height:24px;font-size:11px" title="Rinomina area" onclick="offRenameArea(\''+offEsc(gp).replace(/'/g,"\\'")+'\')">\u270e</button>'+
          '<button class="pgc-abtn del" style="width:24px;height:24px;font-size:11px" title="Elimina area (i prodotti restano)" onclick="offDelArea(\''+offEsc(gp).replace(/'/g,"\\'")+'\')">\ud83d\uddd1</button>'+
          '</span></td></tr>';
      }
      rows.forEach(function(pair){
        var r=pair[0],i=pair[1];n++;
        function inp(f,v,type,ph){
          return '<input class="pgc-inline" style="min-width:0;width:100%" type="'+(type||'text')+'" value="'+offEsc(v)+'" placeholder="'+(ph||'')+'" onchange="offUpd('+i+',\''+f+'\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()">';
        }
        html+='<tr>'+
          '<td>'+inp('pos',r.pos||'','text',String(n).padStart(2,'0'))+'</td>'+
          '<td>'+inp('codice',r.codice)+'</td>'+
          '<td>'+inp('descr',r.descr)+'</td>'+
          '<td>'+inp('modello',r.modello)+'</td>'+
          '<td><input class="pgc-inline" list="off-aree" style="min-width:0;width:100%" value="'+offEsc(r.path||'')+'" placeholder="\u2014" onchange="offUpd('+i+',\'path\',this.value)" onkeydown="if(event.key===\'Enter\')this.blur()"></td>'+
          '<td>'+inp('qty',r.qty,'number')+'</td>'+
          '<td>'+inp('prezzo',r.prezzo,'number')+'</td>'+
          '<td>'+inp('sconto',r.sconto,'number')+'</td>'+
          '<td style="text-align:right;font-weight:600;white-space:nowrap">'+offEur(offRowTot(r))+'</td>'+
          '<td style="text-align:right"><button class="pgc-abtn del" title="Rimuovi riga" onclick="offDel('+i+')">\ud83d\uddd1</button></td>'+
        '</tr>';
      });
    });
    tb.innerHTML=html;
  }
  var tot=OFF.rows.reduce(function(s,r){return s+offRowTot(r);},0);
  var te=document.getElementById('off-tot');
  if(te)te.textContent=offEur(tot);
  /* datalist aree + select destinazione catalogo */
  var dl=document.getElementById('off-aree');
  if(dl)dl.innerHTML=groups.filter(function(g){return g;}).map(function(g){return '<option value="'+offEsc(g)+'">';}).join('');
  var tg=document.getElementById('off-cat-target');
  if(tg){
    var cur=tg.value;
    tg.innerHTML='<option value="">\u2014 Senza area \u2014</option>'+groups.filter(function(g){return g;}).map(function(g){return '<option value="'+offEsc(g)+'">'+offEsc(g)+'</option>';}).join('');
    tg.value=(groups.indexOf(offPathNorm(cur))>=0)?offPathNorm(cur):'';
  }
}

/* ── aree ── */
function offAddArea(){
  var n=prompt('Nome area (usa / per le sottoaree, max 3 livelli):','');
  if(!n)return;
  n=offPathNorm(n);
  if(!n)return;
  if((OFF.areas||[]).indexOf(n)<0)OFF.areas.push(n);
  offRender();
}
function offRenameArea(p){
  var n=prompt('Nuovo nome per "'+p+'" (usa / per i livelli):',p);
  if(!n)return;
  n=offPathNorm(n);
  if(!n||n===p)return;
  OFF.areas=(OFF.areas||[]).map(function(a){
    if(a===p)return n;
    if(a.indexOf(p+' / ')===0)return n+a.slice(p.length);
    return a;
  });
  OFF.rows.forEach(function(r){
    var rp=offPathNorm(r.path||'');
    if(rp===p)r.path=n;
    else if(rp.indexOf(p+' / ')===0)r.path=n+rp.slice(p.length);
  });
  offRender();
}
function offDelArea(p){
  if(!confirm('Eliminare l\u0027area "'+p+'"? I prodotti restano, senza area.'))return;
  OFF.areas=(OFF.areas||[]).filter(function(a){return a!==p&&a.indexOf(p+' / ')!==0;});
  OFF.rows.forEach(function(r){
    var rp=offPathNorm(r.path||'');
    if(rp===p||rp.indexOf(p+' / ')===0)r.path='';
  });
  offRender();
}

var OFF_SEC_OPEN={test:true,cond:true}; /* stato comprimi/espandi per la sessione */
function offSecToggle(which){

  var t=document.getElementById('off-'+which+'-tgl');

/* ── condizioni di vendita: predefinite dal database, copia per-offerta ── */
var OFF_COND_DEF=null;
async function offCondLoadDef(force){
  if(OFF_COND_DEF&&!force)return OFF_COND_DEF;
  try{
    const r=await pgcFetch(PGC_URL+'/rest/v1/condizioni_vendita?select=etichetta,testo&order=ordine.asc',{headers:pgcHdr()});
    if(r.ok){
      const rows=await r.json();
      if(rows.length)OFF_COND_DEF=rows.map(function(x){return {k:x.etichetta,v:x.testo};});
    }
  }catch(e){console.warn('condizioni:',e);}
  if(!OFF_COND_DEF)OFF_COND_DEF=OFF_TPL.condizioni.map(function(c){return {k:c[0],v:c[1]};});
  return OFF_COND_DEF;
}
function offCondCopyDef(){
  return (OFF_COND_DEF||OFF_TPL.condizioni.map(function(c){return {k:c[0],v:c[1]};}))
    .map(function(c){return {k:c.k,v:c.v};});
}
function offCondRender(){
  var box=document.getElementById('off-cond-list');
  if(!box)return;
  box.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:12.5px"><tbody>'+
    (OFF.condizioni||[]).map(function(c,i){
      return '<tr>'+
        '<td style="padding:3px 4px;width:26%;vertical-align:top"><input class="pgc-inline pgc-bold" style="border-color:#e3e2df" value="'+offEsc(c.k)+'" onchange="offCondUpd('+i+',\'k\',this.value)"></td>'+
        '<td style="padding:3px 4px"><input class="pgc-inline" style="border-color:#e3e2df" value="'+offEsc(c.v)+'" onchange="offCondUpd('+i+',\'v\',this.value)"></td>'+
        '<td style="padding:3px 4px;text-align:right;width:36px"><button class="pgc-abtn del" style="width:24px;height:24px;font-size:11px" onclick="offCondDel('+i+')">\ud83d\uddd1</button></td>'+
      '</tr>';
    }).join('')+'</tbody></table>';
}
function offCondUpd(i,f,v){var c=(OFF.condizioni||[])[i];if(c)c[f]=String(v);}
function offCondAdd(){OFF.condizioni=OFF.condizioni||[];OFF.condizioni.push({k:'VOCE:',v:''});offCondRender();}
function offCondDel(i){OFF.condizioni.splice(i,1);offCondRender();}
async function offCondReset(){
  await offCondLoadDef(true);
  OFF.condizioni=offCondCopyDef();
  offCondRender();
}
async function offCondSaveDef(){
  if(!(OFF.condizioni||[]).length){alert('Nessuna condizione da salvare.');return;}
  if(!confirm('Salvare queste condizioni come predefinite per tutte le prossime offerte?'))return;
  try{
    const d=await pgcFetch(PGC_URL+'/rest/v1/condizioni_vendita?id=gt.0',{method:'DELETE',headers:pgcHdr()});
    if(!d.ok)throw new Error('HTTP '+d.status);
    const body=JSON.stringify(OFF.condizioni.map(function(c,i){return {ordine:i+1,etichetta:c.k,testo:c.v};}));
    const r=await pgcFetch(PGC_URL+'/rest/v1/condizioni_vendita',{method:'POST',headers:pgcHdr(true),body:body});
    if(!r.ok)throw new Error('HTTP '+r.status);
    OFF_COND_DEF=OFF.condizioni.map(function(c){return {k:c.k,v:c.v};});
    alert('\u2713 Condizioni predefinite aggiornate.');
  }catch(e){alert('Salvataggio non riuscito: '+e.message);}
}
function offTestAdd(){
  OFF.testata=OFF.testata||[];
  OFF.testata.push({k:'Campo',v:'',print:true});
  offTestRender();
}
function offTestDel(i){OFF.testata.splice(i,1);offTestRender();}
function offTestReset(){OFF.testata=offBuildTestata();offTestRender();}
function offUpd(i,f,v){
  var r=OFF.rows[i]; if(!r)return;
  if(f==='qty'||f==='prezzo'||f==='sconto'){r[f]=parseFloat(String(v).replace(',','.'))||0;}
  else if(f==='pos'){r.pos=String(v).trim();}
  else if(f==='path'){r.path=offPathNorm(v);}
  else if(f==='codice'){
    r.codice=String(v).trim();
    /* prezzo e anagrafica compilati in automatico dal database */
    var cat=OFF_CAT.find(function(x){return x.codice&&String(x.codice).trim()===r.codice;});
    if(cat){
      r.catId=cat.id;
      r.prezzo=Number(cat.prezzo)||0;
      r.brand=cat.brand||'';
      r.nome=cat.nome||'';
      r.modello=cat.modello||'';

/* ── import Excel (stessa filosofia di Disegno/Piano di carico) ── */
function offImportExcel(ev){
  var f=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      var res=offParseExcelRows(rows);
      if(!res.rows.length){alert('Nessuna riga riconosciuta nel file.');return;}
      res.rows.forEach(function(r){OFF.rows.push(r);});
      offRender();
      alert('\u2713 Importate '+res.rows.length+' righe'+(res.matched?' ('+res.matched+' agganciate al catalogo)':'')+'.');
    }catch(err){
      console.warn('offImportExcel:',err);
      alert('Import non riuscito: '+err.message);
    }
  };
  rd.readAsArrayBuffer(f);
}
/* separata e pura per i test: da matrice di celle a righe offerta */
function offParseExcelRows(rows){
  var hdrIdx=-1,ci=-1,qi=-1,pi=-1,di=-1,mi=-1;
  for(var r=0;r<Math.min(rows.length,12);r++){
    var row=rows[r].map(function(x){return String(x).toLowerCase().trim();});
    var c=row.findIndex(function(x){return /^(codice|code|articolo|art\.?|item)$/.test(x)||/codice/.test(x);});
    if(c>=0){
      hdrIdx=r;ci=c;
      qi=row.findIndex(function(x){return /^(q\.?t[a\u00e0]\.?|qta|quantit\u00e0|quantita|qty|pz|pezzi|n\.?)$/.test(x);});
      pi=row.findIndex(function(x){return /prezzo|price|unit/.test(x);});
      di=row.findIndex(function(x){return /descr/.test(x);});
      mi=row.findIndex(function(x){return /^modello|model$/.test(x)||/modello/.test(x);});
      break;
    }
  }
  var out=[],matched=0;
  var start=hdrIdx>=0?hdrIdx+1:0;
  if(hdrIdx<0){ci=0;qi=1;}
  for(var r2=start;r2<rows.length;r2++){
    var row2=rows[r2];
    var code=String(row2[ci]||'').trim();
    if(!code)continue;
    var qty=parseFloat(String(qi>=0?row2[qi]:'1').replace(',','.'))||1;
    var cat=OFF_CAT.find(function(x){return x.codice&&String(x.codice).trim()===code;});
    if(cat){
      matched++;
      out.push({codice:code,brand:cat.brand||'',nome:cat.nome||'',modello:cat.modello||'',
        descr:(cat.brand?cat.brand+' \u2014 ':'')+(cat.nome||''),qty:qty,
        prezzo:Number(cat.prezzo)||0, /* prezzo di listino dal database, sempre */
        sconto:0,catId:cat.id});
    }else{
      out.push({codice:code,brand:'',nome:'',modello:mi>=0?String(row2[mi]||''):'',
        descr:di>=0?String(row2[di]||''):'',qty:qty,
        prezzo:pi>=0?(parseFloat(String(row2[pi]).replace(',','.'))||0):0,sconto:0});
    }
  }
  return {rows:out,matched:matched};
}

          body:JSON.stringify({nome:OFF.nome,tipo:'progetto',dati:{offerta:offPayload()},
            aggiornato:new Date().toISOString(),creato_da:u,aggiornato_da:u})});
        if(!r.ok)throw new Error('HTTP '+r.status);

async function offMergeSave(id){
  try{
    let u=null;try{u=localStorage.getItem('tnk_user')||null;}catch(e){}
    const g=await pgcFetch(PGC_URL+'/rest/v1/progetti?id=eq.'+id+'&select=dati',{headers:pgcHdr()});
    if(!g.ok)throw new Error('HTTP '+g.status);

    const dati=(rows[0]&&rows[0].dati)||{};
    dati.offerta=offPayload(); /* merge: preserva cucina e carico */
    const r=await pgcFetch(PGC_URL+'/rest/v1/progetti?id=eq.'+id,{method:'PATCH',headers:pgcHdr(true),
      body:JSON.stringify({dati:dati,aggiornato:new Date().toISOString(),aggiornato_da:u})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    alert('\u2713 Offerta salvata sul cloud.');

async function offLoadProject(id,quiet){

/* ── trasferimenti verso Disegno e Piano di carico (stessi canali degli import esistenti) ── */
function offExpandItems(){
  var items=[],n=0;
  OFF.rows.forEach(function(r){
    var q=Math.max(1,Math.round(Number(r.qty)||1));
    for(var k=0;k<q&&n<300;k++){n++;
      items.push(r);
    }
  });
  return items;
}
function offAreaFields(r){return {area:offPathNorm(r.path||''),posn:String(r.pos||'')};}
function offToDisegno(){
  if(!OFF.rows.length){alert('L\u0027offerta \u00e8 vuota.');return;}
  var items=offExpandItems().map(function(r){
    var cat=r.catId?OFF_CAT.find(function(x){return x.id===r.catId;}):null;
    var af=offAreaFields(r);
    return {code:r.codice,model:r.modello,kg:cat?(Number(cat.peso_netto_kg)||0):0,area:af.area,posn:af.posn};
  });
  try{localStorage.setItem('tnk_ck_import',JSON.stringify({progetto:OFF.nome,cloudId:OFF.cloudId,items:items}));}catch(e){}
  go('cucina3d');
}
function offToPianoCarico(){
  if(!OFF.rows.length){alert('L\u0027offerta \u00e8 vuota.');return;}
  var skipped=0;
  var items=offExpandItems().map(function(r){
    var cat=r.catId?OFF_CAT.find(function(x){return x.id===r.catId;}):null;
    if(!cat){skipped++;return null;}
    var imb=cat.larghezza_imballo_mm&&cat.profondita_imballo_mm&&cat.altezza_imballo_mm;
    var af=offAreaFields(r);
    return {
      l:imb?cat.larghezza_imballo_mm:cat.l, p:imb?cat.profondita_imballo_mm:cat.p, h:imb?cat.altezza_imballo_mm:cat.h,
      brand:cat.brand||'', nome:cat.nome||r.descr, model:r.modello, code:r.codice,
      kg:Number(cat.peso_lordo_kg)||Number(cat.peso_netto_kg)||0, imballo:!!imb,
      area:af.area, posn:af.posn
    };
  }).filter(Boolean);
  if(!items.length){alert('Nessuna riga agganciata al catalogo: per il piano di carico servono le dimensioni.');return;}
  try{localStorage.setItem('tnk_pc_import',JSON.stringify({progetto:OFF.nome,cloudId:OFF.cloudId,items:items}));}catch(e){}
  if(skipped)alert(skipped+' righe senza aggancio al catalogo non verranno trasferite (mancano le dimensioni).');
  go('pianocarico');
}

var _ckBlobUrl=null;
function cucina3D(){

       + '<iframe id="ck-iframe" style="width:100%;height:100%;border:none;display:block"></iframe>'

function _ckDeliver(f){
  /* apertura diretta di un progetto per ID (dalla pagina Progetti) */
  var openId=null; try{openId=localStorage.getItem('tnk_ck_open_id');}catch(e){}
  if(openId){
    var triesO=0;
    (function attemptOpen(){
      triesO++;
      try{
        if(f.contentWindow&&typeof f.contentWindow.cloudLoad==='function'){
          f.contentWindow.cloudLoad(openId);
          try{localStorage.removeItem('tnk_ck_open_id');}catch(_){}
          return;
        }
      }catch(e){}
      if(triesO<60)setTimeout(attemptOpen,250);
    })();
  }
  var raw=null; try{raw=localStorage.getItem('tnk_ck_import');}catch(e){}
  if(!raw)return;
  var payload=null;
  try{payload=JSON.parse(raw);}catch(e){try{localStorage.removeItem('tnk_ck_import');}catch(_){ } return;}
  var tries=0;
  (function attempt(){
    tries++;
    try{
      if(f.contentWindow&&typeof f.contentWindow.importFromPianoCarico==='function'){
        f.contentWindow.importFromPianoCarico(payload);
        try{localStorage.removeItem('tnk_ck_import');}catch(_){}
        return;
      }
    }catch(e){}
    if(tries<60)setTimeout(attempt,250);
  })();
}
function initCK(){

var GLANG_LABELS={it:'Italiano',en:'English',fr:'Français',de:'Deutsch'};
function renderGlobalLang(){
  var box=document.getElementById('lang-global');
  if(!box)return;
  box.innerHTML='';
  ['it','en','fr','de'].forEach(function(l){
    var b=document.createElement('button');
    b.type='button';
    b.className='st-lang'+(l===GLANG?' active':'');
    b.title=GLANG_LABELS[l];
    b.setAttribute('aria-label',GLANG_LABELS[l]);
    b.innerHTML=GLANG_FLAGS[l];
    b.addEventListener('click',function(){setGlobalLang(l);});
    box.appendChild(b);
  });
}
function _broadcastLang(){
  document.querySelectorAll('iframe').forEach(function(f){
    try{
      if(f.contentWindow&&typeof f.contentWindow.setLangExternal==='function')
        f.contentWindow.setLangExternal(GLANG);
    }catch(e){}
  });
  try{window.dispatchEvent(new CustomEvent('tnk-lang',{detail:GLANG}));}catch(e){}
}
function setGlobalLang(l){
  if(['it','en','fr','de'].indexOf(l)<0)return;
  GLANG=l;
  try{localStorage.setItem('tnk_lang',GLANG);}catch(e){}
  renderGlobalLang();
  _broadcastLang();
}
document.addEventListener('DOMContentLoaded',renderGlobalLang);

function _pcDeliver(f){
  /* apertura diretta di un progetto per ID (dalla pagina Progetti) */
  var openId=null; try{openId=localStorage.getItem('tnk_pc_open_id');}catch(e){}
  if(openId){
    var triesO=0;
    (function attemptOpen(){
      triesO++;
      try{
        if(f.contentWindow&&typeof f.contentWindow.pcCloudLoad==='function'){
          f.contentWindow.pcCloudLoad(openId);
          try{localStorage.removeItem('tnk_pc_open_id');}catch(_){}
          return;
        }
      }catch(e){}
      if(triesO<60)setTimeout(attemptOpen,250);
    })();
  }
  var raw=null; try{raw=localStorage.getItem('tnk_pc_import');}catch(e){}
  if(!raw)return;
  var payload=null;
  try{payload=JSON.parse(raw);}catch(e){try{localStorage.removeItem('tnk_pc_import');}catch(_){ } return;}
  var tries=0;
  (function attempt(){
    tries++;
    try{
      if(f.contentWindow&&typeof f.contentWindow.importFromConfiguratore==='function'){
        f.contentWindow.importFromConfiguratore(payload);
        try{localStorage.removeItem('tnk_pc_import');}catch(_){}
        return;
      }
    }catch(e){}
    if(tries<60)setTimeout(attempt,250);
  })();
}
function initPC(){

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalize(value) {
      return String(value ?? "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }

    function sanitizeFilePart(value) {
      return String(value ?? "")
        .trim()
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, " ")
        .replace(/-+/g, "-")
        .replace(/^[-\s]+|[-\s]+$/g, "");
    }

    function classifyRow(brand, row) {
      const name = String(row.name ?? "").trim();
      if (brand === "Modular") return name || "Altro";
      if (brand === "Nevo") {
        if (!name) return "Altro";
        if (name.startsWith("Forno ")) return name.replace("Forno ", "");
        if (name.startsWith("Lievitatore ")) return "Lievitatori";
        return name;
      }
      if (brand === "Coldline") {
        const mapping = [
          ["Abbattitore Modi Active", "Abbattitori Modi Active"],
          ["Abbattitore Modi Up", "Abbattitori Modi Up"],
          ["Abbattitore Vision", "Abbattitori Vision"],
          ["Abbattitore Smart", "Abbattitori Smart"],
          ["Abbattitore Roll-in", "Abbattitori Roll-in"],
          ["Tavolo Master", "Tavoli Master"],
          ["Tavolo Arkis", "Tavoli Arkis"],
          ["Tavolo Saladette", "Saladette"],
          ["Tavolo Pastry", "Tavoli Pastry"],
          ["Tavolo Snack", "Tavoli Snack"],
          ["Tavolo Prep-station", "Prep Station"],
          ["Tavolo Vision", "Tavoli Vision"],
          ["Tavolo Smart", "Tavoli Smart"],
          ["Tavolo Levtronic", "Tavoli Levtronic"],
          ["Tavolo Base", "Tavoli Base"],
          ["Tavolo Completo", "Tavoli completi"],
          ["Tavolo abbattitore", "Tavoli abbattitori"],
          ["Tavolo Abbattitore", "Tavoli abbattitori"],
          ["Armadio Master", "Armadi Master"],
          ["Armadio Smart", "Armadi Smart"],
          ["Armadio Vision", "Armadi Vision"],
          ["Armadio Levtronic", "Armadi Levtronic"],
          ["Armadio Wind", "Armadi Wind"],
          ["Armadio Ice", "Armadi Ice"],
          ["Armadio Clima", "Armadi Clima"],
          ["Armadio decongelatore", "Armadi decongelatori"],
          ["Vision Industry", "Vision Industry"],
          ["Vetrina", "Vetrine"],
          ["Roll-in Vision", "Roll-in Vision"],
          ["Roll-in Levtronic", "Roll-in Levtronic"],
          ["Roll-in", "Roll-in"],
          ["Pass-Through", "Pass-Through"]
        ];
        if (!name) return "Altro";
        for (const [prefix, category] of mapping) {
          if (name.startsWith(prefix)) return category;
        }
        const words = name.split(/\s+/).filter(Boolean);
        return words.length ? words.slice(0, 2).join(" ") : "Altro";
      }
      return "";
    }

    function makeUrl(brand, id, lang) {
      const host = DATA[brand].host;
      return `https://${host}/coldline/product/print/${encodeURIComponent(id)}?language=${encodeURIComponent(lang)}`;
    }

    function getActiveLangs() {
      /* la lingua è globale (selettore nella sidebar del portale) */
      var l='it';
      try{l=localStorage.getItem('tnk_lang')||'it';}catch(e){}
      return LANGS.includes(l) ? [l] : ['it'];
    }

    function makeFilename(row) {
      const model = sanitizeFilePart(row.model);
      const code = sanitizeFilePart(row.code);
      const name = sanitizeFilePart(row.name);
      let base = "";
      switch (state.filenameMode) {
        case "code":
          base = code || model || row.id;
          break;
        case "model_name":
          base = [model, name].filter(Boolean).join(" - ") || code || row.id;
          break;
        case "code_model":
          base = [code, model].filter(Boolean).join(" - ") || row.id;
          break;
        default:
          base = model || code || row.id;
      }
      return `${base}_${row.lang}.pdf`;
    }

    function getBaseRows() {
      const rows = [];
      for (const brand of BRAND_ORDER) {
        if (!state.activeBrands[brand]) continue;
        const allowed = new Set(state.brandSubcats[brand] || []);
        const hasSubcats = (BRAND_CATEGORIES[brand] || []).length > 0;
        for (const item of DATA[brand].rows) {
          const row = {
            brand,
            id: item[0],
            code: item[1],
            model: item[2],
            name: item[3]
          };
          row.category = classifyRow(brand, row);
          if (hasSubcats && !allowed.has(row.category)) continue;
          rows.push(row);
        }
      }
      return rows;
    }

    function getFilteredProducts() {
      const search = normalize(state.search);
      const rows = getBaseRows();
      if (!search) return rows;
      return rows.filter(r => normalize(`${r.code} ${r.model} ${r.name} ${r.category}`).includes(search));
    }

    function expandRowsByLang(rows) {
      const activeLangs = getActiveLangs();
      const expanded = [];
      for (const row of rows) {
        for (const lang of activeLangs) expanded.push({ ...row, lang });
      }
      return expanded;
    }

    function renderFilenameMode() {
      const box = document.getElementById("filenameModeToggle");
      if (!box) return;
      const buttons = box.querySelectorAll(".mode-flag");
      buttons.forEach(btn => {
        const active = btn.dataset.mode === state.filenameMode;
        btn.classList.toggle("active", active);
      });
    }

    function renderBrands() {
      const box = document.getElementById("brandBox");
      box.innerHTML = "";
      for (const brand of BRAND_ORDER) {
        const active = !!state.activeBrands[brand];
        const count = DATA[brand].rows.length;
        const categories = BRAND_CATEGORIES[brand] || [];
        const hasMenu = categories.length > 0;
        const selected = new Set(state.brandSubcats[brand] || []);
        const selectedCount = selected.size;
        const summary = !hasMenu
          ? "Selezione diretta"
          : selectedCount === categories.length
            ? "Tutte le sottocategorie"
            : selectedCount === 0
              ? "Nessuna sottocategoria"
              : `${selectedCount} di ${categories.length} sottocategorie`;

        const card = document.createElement("div");
        card.className = `st-brand-card ${active ? "active" : ""} ${state.openMenus[brand] ? "open" : ""}`.trim();

        const row = document.createElement("div");
        row.className = "st-brand-row";

        const main = document.createElement("button");
        main.className = "st-brand-main";
        main.innerHTML = `
          <span class="st-brand-left">
            <span class="st-checkbox">${active ? "✓" : ""}</span>
            <span class="st-brand-meta">
              <span class="st-brand-name">${esc(brand)}</span>
            </span>
          </span>
          <span class="st-brand-count">${count.toLocaleString("it-IT")}</span>
        `;
        main.addEventListener("click", () => {
          state.activeBrands[brand] = !state.activeBrands[brand];
          state.page = 1;
          stUpdate();
        });
        row.appendChild(main);

        if (hasMenu) {
          const toggle = document.createElement("button");
          toggle.className = `submenu-toggle ${state.openMenus[brand] ? "open" : ""}`;
          toggle.title = `Apri sottocategorie ${brand}`;
          toggle.setAttribute("aria-label", `Apri sottocategorie ${brand}`);
          toggle.setAttribute("aria-expanded", state.openMenus[brand] ? "true" : "false");
          toggle.addEventListener("click", (ev) => {
            ev.stopPropagation();
            state.openMenus[brand] = !state.openMenus[brand];
            stUpdate();
          });
          row.appendChild(toggle);
        }

        card.appendChild(row);

        if (hasMenu) {
          const menu = document.createElement("div");
          menu.className = `submenu ${state.openMenus[brand] ? "open" : ""}`;

          const head = document.createElement("div");
          head.className = "st-submenu-head";
          head.innerHTML = `
            <div class="st-submenu-title">Sottocategorie</div>
            <div class="st-submenu-actions">
              <button class="ghost mini-btn" type="button">Tutte</button>
              <button class="ghost mini-btn" type="button">Nessuna</button>
            </div>
          `;
          const [allBtn, noneBtn] = head.querySelectorAll("button");
          allBtn.addEventListener("click", () => {
            state.activeBrands[brand] = true;
            state.brandSubcats[brand] = [...categories];
            state.page = 1;
            stUpdate();
          });
          noneBtn.addEventListener("click", () => {
            state.brandSubcats[brand] = [];
            state.page = 1;
            stUpdate();
          });
          menu.appendChild(head);

          const grid = document.createElement("div");
          grid.className = "st-subcat-grid";
          for (const cat of categories) {
            const chip = document.createElement("div");
            const isActive = selected.has(cat);
            chip.className = `subcat ${isActive ? "active" : ""}`;
            chip.textContent = cat;
            chip.addEventListener("click", () => {
              const next = new Set(state.brandSubcats[brand] || []);
              if (next.has(cat)) next.delete(cat);
              else next.add(cat);
              state.activeBrands[brand] = true;
              state.brandSubcats[brand] = categories.filter(item => next.has(item));
              state.page = 1;
              stUpdate();
            });
            grid.appendChild(chip);
          }
          menu.appendChild(grid);
          card.appendChild(menu);
        }

        box.appendChild(card);
      }
    }

    function renderStats(baseProducts, rows) {
      const activeCount = BRAND_ORDER.filter(b => state.activeBrands[b]).length;
      const activeLangs = getActiveLangs();

      document.getElementById("statAvailable").textContent = baseProducts.length.toLocaleString("it-IT");

    function renderTable(rows) {
      const body = document.getElementById("resultBody");
      const mobile = document.getElementById("mobileResultCards");
      const pageSize = Number(state.pageSize) || 50;
      const totalPages = Math.max(1, Math.ceil(rows.length / pageSize));
      if (state.page > totalPages) state.page = totalPages;
      const start = (state.page - 1) * pageSize;
      const visible = rows.slice(start, start + pageSize);

      document.getElementById("resultInfo").textContent =
        rows.length
          ? `${rows.length.toLocaleString("it-IT")} risultati. Pagina ${state.page} di ${totalPages}. Visualizzazione da ${start + 1} a ${Math.min(start + visible.length, rows.length)}.`
          : "Nessun risultato con i filtri correnti.";

      document.getElementById("renderNote").textContent =
        rows.length > pageSize
          ? `Tabella paginata a ${pageSize} righe per pagina. Il download lavora su tutti i risultati filtrati.`
          : "La tabella mostra tutti i risultati correnti.";

      document.getElementById("prevBtn").disabled = state.page <= 1;
      document.getElementById("nextBtn").disabled = state.page >= totalPages;
      document.getElementById("downloadBtn").disabled = rows.length === 0 || state.downloadInProgress || !state.folderChosen;

      if (!visible.length) {
        body.innerHTML = '<tr><td colspan="9" class="st-muted">Nessun risultato.</td></tr>';
        if (mobile) mobile.innerHTML = '<div class="st-empty">Nessun risultato.</div>';
        return;
      }

      body.innerHTML = visible.map((row, idx) => {
        const url = makeUrl(row.brand, row.id, row.lang);
        const fileName = makeFilename(row);
        return `
          <tr>
            <td>${start + idx + 1}</td>
            <td>${esc(row.brand)}</td>
            <td>${esc(row.category || "—")}</td>
            <td class="code">${esc(row.lang.toUpperCase())}</td>
            <td class="code">${esc(row.code)}</td>
            <td>${esc(row.model)}</td>
            <td>${esc(row.name)}</td>
            <td>${esc(fileName)}</td>
            <td><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Apri PDF</a></td>
          </tr>
        `;
      }).join("");

      if (mobile) {
        mobile.innerHTML = visible.map((row, idx) => {
          const url = makeUrl(row.brand, row.id, row.lang);
          const fileName = makeFilename(row);
          return `
            <article class="st-result-card">
              <div class="st-result-head">
                <div class="st-result-title">
                  <div class="st-result-brand">${esc(row.brand)} · ${esc(row.category || "—")}</div>
                  <div class="st-result-model">${esc(row.model || row.code || fileName)}</div>
                </div>
                <div class="st-result-lang">${esc(row.lang.toUpperCase())}</div>
              </div>
              <div class="st-result-grid">
                <div class="st-result-item">
                  <div class="label">#</div>
                  <div class="value">${start + idx + 1}</div>
                </div>
                <div class="st-result-item">
                  <div class="label">Code</div>
                  <div class="value mono">${esc(row.code)}</div>
                </div>
                <div class="st-result-item full">
                  <div class="label">Descrizione</div>
                  <div class="value">${esc(row.name)}</div>
                </div>
                <div class="st-result-item full">
                  <div class="label">File PDF</div>
                  <div class="value">${esc(fileName)}</div>
                </div>
              </div>
              <a class="st-result-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Apri PDF</a>
            </article>
          `;
        }).join("");
      }
    }

    function getCurrentRows() {
      return expandRowsByLang(getFilteredProducts());
    }
    function setProgress(done, total) {
      state.progressDone = done;
      state.progressTotal = total;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      const chips = [document.getElementById("progressChip"), document.getElementById("mobileProgressChip")].filter(Boolean);
      const fills = [document.getElementById("progressFill"), document.getElementById("mobileProgressFill")].filter(Boolean);
      for (const chip of chips) {
        chip.textContent = `${pct}%`;
        chip.title = total > 0 ? `${done} / ${total} schede avviate` : "Nessun download avviato";
      }
      for (const fill of fills) fill.style.width = `${pct}%`;
    }

    function updateFolderButton() {
      const desktopBtn = document.getElementById("pickFolderBtn");
      const mobileBtn = document.getElementById("mobilePickFolderBtn");
      const desktopText = state.folderChosen ? (state.folderName || "Cartella selezionata") : "Seleziona cartella";
      const mobileText = state.folderChosen ? "Cartella OK" : "Cartella";
      if (desktopBtn) {
        desktopBtn.textContent = desktopText;
        desktopBtn.disabled = state.folderChosen;
      }
      if (mobileBtn) {
        mobileBtn.textContent = mobileText;
        mobileBtn.disabled = state.folderChosen;
      }
    }

    async function pickFolder() {
      if (state.folderChosen) return true;
      if (typeof window.showDirectoryPicker !== "function") {
        alert("Il browser non supporta la selezione della cartella in HTML puro. Usa Chrome o Edge desktop.");
        return false;
      }
      try {
        const handle = await window.showDirectoryPicker({ mode: "readwrite" });
        state.folderChosen = true;
        state.folderName = handle?.name || "Cartella selezionata";
        stUpdate();
        return true;
      } catch (err) {
        return false;
      }
    }

    function ensureDownloadHost() {
      let host = document.getElementById("nativeDownloadHost");
      if (!host) {
        host = document.createElement("div");
        host.id = "nativeDownloadHost";
        host.style.display = "none";
        document.body.appendChild(host);
      }
      return host;
    }

    function triggerNativeDownload(url, token) {
      const host = ensureDownloadHost();
      const frame = document.createElement("iframe");
      frame.setAttribute("aria-hidden", "true");
      frame.tabIndex = -1;
      frame.style.width = "0";
      frame.style.height = "0";
      frame.style.border = "0";
      frame.style.position = "fixed";
      frame.style.right = "0";
      frame.style.bottom = "0";
      frame.id = `dl_${token}`;
      frame.src = url;
      host.appendChild(frame);
      window.setTimeout(() => {
        try { frame.remove(); } catch (e) {}
      }, 45000);
    }

    async function startDownload(rows) {
      if (!rows.length || state.downloadInProgress || !state.folderChosen) return;
      state.downloadInProgress = true;
      setProgress(0, rows.length);
      stUpdate();
      try {
        const delay = window.innerWidth <= 900 ? 1800 : 1300;
        for (let i = 0; i < rows.length; i += 1) {
          const row = rows[i];
          const url = makeUrl(row.brand, row.id, row.lang);
          triggerNativeDownload(url, `${Date.now()}_${i}`);
          setProgress(i + 1, rows.length);
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      } finally {
        state.downloadInProgress = false;
        stUpdate();
      }
    }
    function stUpdate() {
      const baseProducts = getBaseRows();
      const filteredProducts = getFilteredProducts();
      const rows = expandRowsByLang(filteredProducts);
      renderFilenameMode();
      renderBrands();
      renderStats(baseProducts, rows);
      const pageSizeSelect = document.getElementById("pageSizeSelect");
      if (pageSizeSelect) pageSizeSelect.value = String(state.pageSize);
      renderTable(rows);
      updateFolderButton();
      if (!state.downloadInProgress && state.progressTotal === 0) setProgress(0, 0);
      const shouldDisableDownload = rows.length === 0 || state.downloadInProgress || !state.folderChosen;
      const downloadBtn = document.getElementById("downloadBtn");
      const mobileDownloadBtn = document.getElementById("mobileDownloadBtn");
      if (downloadBtn) downloadBtn.disabled = shouldDisableDownload;
      if (mobileDownloadBtn) mobileDownloadBtn.disabled = shouldDisableDownload;
    }

    
let _stInit=false;
function initST(){
  if(!document.getElementById('searchInput'))return;
  if(_stInit){stUpdate();return;}
  _stInit=true;
  window.addEventListener('tnk-lang',function(){ if(_stInit) stUpdate(); });
document.getElementById("searchInput").addEventListener("input", (ev) => {
      state.search = ev.target.value || "";
      state.page = 1;
      stUpdate();
    });

    document.getElementById("filenameModeToggle").addEventListener("click", (ev) => {
      const btn = ev.target.closest(".mode-flag");
      if (!btn) return;
      state.filenameMode = btn.dataset.mode || "model";
      stUpdate();
    });

    document.getElementById("pageSizeSelect").addEventListener("change", (ev) => {
      state.pageSize = Number(ev.target.value) || 50;
      state.page = 1;
      stUpdate();
    });

    document.getElementById("allBrandsBtn").addEventListener("click", () => {
      for (const brand of BRAND_ORDER) {
        state.activeBrands[brand] = true;
        if ((BRAND_CATEGORIES[brand] || []).length > 0) {
          state.brandSubcats[brand] = [...BRAND_CATEGORIES[brand]];
        }
      }
      state.page = 1;
      stUpdate();
    });

    document.getElementById("noneBrandsBtn").addEventListener("click", () => {
      for (const brand of BRAND_ORDER) state.activeBrands[brand] = false;
      state.page = 1;
      stUpdate();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      state.search = "";
      document.getElementById("searchInput").value = "";
      state.page = 1;
      stUpdate();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      state.page = Math.max(1, state.page - 1);
      stUpdate();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      const rows = getCurrentRows();
      const totalPages = Math.max(1, Math.ceil(rows.length / (Number(state.pageSize) || 50)));
      state.page = Math.min(totalPages, state.page + 1);
      stUpdate();
    });

    document.getElementById("pickFolderBtn").addEventListener("click", pickFolder);
    document.getElementById("mobilePickFolderBtn").addEventListener("click", pickFolder);
    document.getElementById("downloadBtn").addEventListener("click", () => startDownload(getCurrentRows()));
    document.getElementById("mobileDownloadBtn").addEventListener("click", () => startDownload(getCurrentRows()));

    stUpdate();
  stUpdate();
}
go('progetticloud');
</script>
</body>
</html>
